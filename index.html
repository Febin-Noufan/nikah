<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Save the date for the Nikah of Febin Noufan and Fathima Shihana, 27 November 2026, 9:00 AM, Kozhunjil Jumah Masjid.">
<title>Febin &amp; Shihana Nikah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="bismillah" lang="ar" dir="rtl">بسم الله الرحمن الرحيم</p>

  <section class="arch" aria-label="Nikah of Febin Noufan and Fathima Shihana">
    <p class="eyebrow">Save the date</p>
    <h1 class="names">
      <span>Febin Noufan</span>
      <span class="amp">&amp;</span>
      <span>Fathima Shihana</span>
    </h1>
    <p class="occasion">Nikah</p>
  </section>

  <section class="date" aria-label="Date">
    <span class="weekday">Friday</span>
    <span class="day">27</span>
    <span class="month">November 2026</span>
    <span class="time">9:00 AM</span>
  </section>

  <section id="countdown-wrap" style="width:100%" aria-label="Countdown to the Nikah">
    <div class="countdown" id="countdown" role="timer" aria-live="off">
      <div class="unit"><span class="num" id="cd-d">--</span><span class="lbl">Days</span></div>
      <div class="unit"><span class="num" id="cd-h">--</span><span class="lbl">Hours</span></div>
      <div class="unit"><span class="num" id="cd-m">--</span><span class="lbl">Minutes</span></div>
      <div class="unit"><span class="num" id="cd-s">--</span><span class="lbl">Seconds</span></div>
    </div>
    <p class="done" id="cd-done" hidden></p>
  </section>

  <section class="venue" aria-label="Venue">
    <p class="label">Venue</p>
    <h2>Kozhunjil Jumah Masjid</h2>
    <div class="actions">
      <a class="btn primary" href="https://www.google.com/maps/search/?api=1&amp;query=Kozhunjil+Jumah+Masjid" target="_blank" rel="noopener">Open in Maps</a>
      <a class="btn ghost" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Nikah%3A+Febin+Noufan+%26+Fathima+Shihana&amp;dates=20261127T090000/20261127T100000&amp;ctz=Asia%2FKolkata&amp;location=Kozhunjil+Jumah+Masjid&amp;details=Save+the+date+for+the+Nikah+of+Febin+Noufan+and+Fathima+Shihana.+Formal+invitation+to+follow." target="_blank" rel="noopener">Add to calendar</a>
    </div>
  </section>

  <p class="foot"><strong>Formal invitation to follow.</strong> Please keep us in your duas and join us for the Nikah.</p>
</main>
<script src="script.js"></script>
</body>
</html>
